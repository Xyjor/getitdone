name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres database just for this CI run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: getitdone
          POSTGRES_PASSWORD: getitdone
          POSTGRES_DB: getitdone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U getitdone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://getitdone:getitdone@localhost:5432/getitdone?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
