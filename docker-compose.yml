# Local development database.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept in the "pgdata" volume)
#   Reset:  docker compose down -v     (deletes all local data)
services:
  db:
    image: postgres:17-alpine
    container_name: getitdone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: getitdone
      POSTGRES_PASSWORD: getitdone
      POSTGRES_DB: getitdone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getitdone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
